services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    environment:
      # server-side fetches (inside docker the API is usually another service name)
      SERVER_API_URL: ${SERVER_API_URL:-http://host.docker.internal:4000/api}
    restart: unless-stopped
